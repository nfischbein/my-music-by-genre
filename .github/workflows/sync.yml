name: Daily Spotify Sync

on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC daily (10 PM EST / 7 PM PST)
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install spotipy gspread google-auth pandas requests python-dotenv

      - name: Restore genre cache
        uses: actions/cache@v4
        with:
          path: |
            .genre_cache.json
            .genre_cache_albums.json
          key: genre-cache-${{ github.run_id }}
          restore-keys: |
            genre-cache-

      - name: Restore checkpoints
        uses: actions/cache@v4
        with:
          path: checkpoints/
          key: checkpoints-${{ github.run_id }}
          restore-keys: |
            checkpoints-

      - name: Write Google service account credentials
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENTS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENTS" > service-account.json

      - name: Write Spotify token cache
        env:
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        run: |
          python - <<'EOF'
          import json, os
          # Write a pre-authorized token cache so spotipy skips the browser OAuth flow
          token_info = {
              "access_token": "",
              "token_type": "Bearer",
              "expires_in": 3600,
              "refresh_token": os.environ["SPOTIPY_REFRESH_TOKEN"],
              "scope": "user-library-read user-follow-read user-read-recently-played",
              "expires_at": 0
          }
          with open(".spotify_token_cache.json", "w") as f:
              json.dump(token_info, f)
          EOF

      - name: Run sync
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: http://localhost:8888/callback
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python spotify_to_sheets.py --update

      - name: Clean up credentials
        if: always()
        run: rm -f service-account.json .spotify_token_cache.json
