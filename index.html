<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Music">
<title>My Music by Genre</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0a; --bg2: #141414; --bg3: #1e1e1e;
  --border: rgba(255,255,255,0.08);
  --text: #f0f0f0; --text2: #999; --text3: #555;
  --green: #1db954; --radius: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
a:visited { color: inherit; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--border);
  padding: 12px 16px 0;
}
.header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; overflow: visible; }
.header-top h1 { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.header-top h1 span { color: var(--green); }
.gear-btn { width: 34px; height: 34px; border-radius: 17px; background: var(--bg3); border: 0.5px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); flex-shrink: 0; touch-action: manipulation; -webkit-appearance: none; }

.search-wrap { position: relative; margin-bottom: 10px; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text3); pointer-events: none; }
.search-input { width: 100%; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; padding: 8px 12px 8px 34px; outline: none; -webkit-appearance: none; }
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--green); }

.top-nav { display: flex; }
.nav-btn { flex: 1; padding: 10px 4px; background: transparent; border: none; color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; touch-action: manipulation; }
.nav-btn.active { color: var(--green); border-bottom-color: var(--green); }

.sub-nav { display: none; background: var(--bg2); border-bottom: 0.5px solid var(--border); padding: 0 16px; }
.sub-nav.visible { display: flex; }
.sub-btn { flex: 1; padding: 9px 4px; background: transparent; border: none; color: var(--text2); font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; touch-action: manipulation; }
.sub-btn.active { color: var(--green); border-bottom-color: var(--green); }

.drill-bar { display: none; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
.drill-bar.visible { display: block; }
.drill-top { display: flex; align-items: center; padding: 10px 16px; gap: 10px; }
.back-btn { background: transparent; border: none; color: var(--green); font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 3px; touch-action: manipulation; }
.drill-title { font-size: 15px; font-weight: 600; text-transform: capitalize; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drill-tabs { display: flex; padding: 0 16px; }
.drill-tab { flex: 1; padding: 8px; background: transparent; border: none; color: var(--text2); font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; touch-action: manipulation; }
.drill-tab.active { color: var(--green); border-bottom-color: var(--green); }

.toolbar { display: flex; align-items: center; padding: 8px 16px; gap: 6px; border-bottom: 0.5px solid var(--border); }
.count-lbl { font-size: 12px; color: var(--text3); flex: 1; }
.filter-btn { display: none; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 16px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 12px; cursor: pointer; max-width: 140px; touch-action: manipulation; }
.filter-btn.show { display: flex; }
.filter-btn.active { border-color: var(--green); color: var(--green); }
.filter-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sort-btn { padding: 5px 9px; border-radius: 16px; border: 0.5px solid var(--border); background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.sort-btn.active { border-color: var(--green); color: var(--green); }
.view-toggle { display: flex; gap: 3px; }
.view-btn { width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid var(--border); background: transparent; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.view-btn.active { border-color: var(--green); color: var(--green); }
.view-btn svg { width: 13px; height: 13px; }

.content { padding: 12px 16px; padding-bottom: calc(32px + var(--safe-bottom)); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; text-decoration: none; display: block; }
.card:active { border-color: var(--green); }
.card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg3); display: block; }
.card-ph { width: 100%; aspect-ratio: 1; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 32px; }
.card-body { padding: 9px; }
.card-name { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 3px; }
.card-sub { font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
.card-genres { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 3px; }
.gtag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(29,185,84,0.12); color: var(--green); font-weight: 500; }
.card-date { font-size: 10px; color: var(--text3); }

.list { display: flex; flex-direction: column; }
.litem { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid var(--border); text-decoration: none; }
.litem:last-child { border-bottom: none; }
.lthumb { width: 48px; height: 48px; border-radius: 6px; background: var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; }
.lthumb img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; display: block; }
.linfo { flex: 1; min-width: 0; }
.lname { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lsub { font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.ldate { font-size: 11px; color: var(--text3); flex-shrink: 0; text-align: right; max-width: 70px; line-height: 1.3; }
.lnum { font-size: 12px; color: var(--text3); width: 24px; text-align: right; flex-shrink: 0; margin-right: 4px; }
.artist-header { font-size: 13px; font-weight: 600; color: var(--text2); padding: 14px 0 6px; border-bottom: 0.5px solid var(--border); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.artist-header:first-child { padding-top: 4px; }

.genre-list { display: flex; flex-direction: column; }
.grow { display: flex; align-items: center; padding: 13px 0; border-bottom: 0.5px solid var(--border); cursor: pointer; touch-action: manipulation; }
.grow:last-child { border-bottom: none; }
.grow:active .gname { color: var(--green); }
.gname { flex: 1; font-size: 15px; font-weight: 500; text-transform: capitalize; }
.gcounts { font-size: 12px; color: var(--text3); margin-right: 10px; }
.garrow { font-size: 16px; color: var(--text3); }

.modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; display: flex; align-items: flex-end; }
.modal { background: var(--bg2); border-radius: 20px 20px 0 0; border: 0.5px solid var(--border); width: 100%; max-height: 78vh; display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); }
.mhead { display: flex; align-items: center; padding: 16px 20px 12px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.mhead h3 { flex: 1; font-size: 16px; font-weight: 600; }
.mclose { background: transparent; border: none; color: var(--text2); font-size: 24px; cursor: pointer; line-height: 1; padding: 0 4px; }
.msearch { padding: 10px 16px; flex-shrink: 0; }
.msearch input { width: 100%; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; padding: 8px 12px; outline: none; -webkit-appearance: none; }
.mlist { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px; flex: 1; }
.mgenre { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border); cursor: pointer; touch-action: manipulation; }
.mgenre:last-child { border-bottom: none; }
.mgenre:active { opacity: 0.7; }
.mgname { flex: 1; font-size: 15px; text-transform: capitalize; }
.mgcount { font-size: 12px; color: var(--text3); }
.mgenre.sel .mgname { color: var(--green); font-weight: 600; }
.mgenre.sel .mgcount { color: var(--green); }

/* ── Artist inline expand ────────────────────────────────── */
/* Grid: expand panel spans full width below the row of 2 cards */
.artist-card-wrap { display: contents; }
.artist-expand {
  grid-column: 1 / -1;
  background: var(--bg3);
  border: 0.5px solid var(--green);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: -4px;
}
.aex-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
.aex-img { width: 44px; height: 44px; border-radius: 22px; object-fit: cover; background: var(--bg2); flex-shrink: 0; display: block; }
.aex-img-ph { width: 44px; height: 44px; border-radius: 22px; background: var(--bg2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.aex-info { flex: 1; min-width: 0; }
.aex-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aex-genres { font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.aex-spotify { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 14px; background: var(--green); color: #000; font-size: 11px; font-weight: 600; text-decoration: none; flex-shrink: 0; white-space: nowrap; }
.aex-spotify svg { width: 10px; height: 10px; }
.aex-close { width: 28px; height: 28px; border-radius: 14px; background: var(--bg2); border: 0.5px solid var(--border); color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: manipulation; }
.aex-section-lbl { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.7px; padding: 10px 14px 6px; display: flex; align-items: center; }
.aex-album { display: flex; align-items: center; gap: 10px; padding: 8px 14px; text-decoration: none; border-top: 0.5px solid var(--border); }
.aex-album:active .aex-album-name { color: var(--green); }
.aex-album-art { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; background: var(--bg2); flex-shrink: 0; display: block; }
.aex-album-art-ph { width: 40px; height: 40px; border-radius: 5px; background: var(--bg2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.aex-album-info { flex: 1; min-width: 0; }
.aex-album-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aex-album-year { font-size: 11px; color: var(--text2); margin-top: 1px; }
.aex-album-arrow { font-size: 16px; color: var(--text3); flex-shrink: 0; }
.aex-empty { padding: 18px 14px 20px; text-align: center; }
.aex-empty-msg { font-size: 13px; color: var(--text2); margin-bottom: 14px; }
.aex-empty-btn { display: inline-flex; align-items: center; gap: 5px; padding: 9px 18px; border-radius: 18px; background: var(--green); color: #000; font-size: 13px; font-weight: 600; text-decoration: none; }
.aex-empty-btn svg { width: 12px; height: 12px; }
/* List view: expand sits as a full-width block below the row */
.litem-artist { cursor: pointer; }
.litem-artist:active .lname { color: var(--green); }
.litem-expand { background: var(--bg3); border-left: 2px solid var(--green); margin: 0 0 0 60px; border-radius: 0 0 8px 8px; overflow: hidden; }
.litem-expand .aex-header { padding: 10px 12px; }
.litem-expand .aex-album { padding: 7px 12px; }
.litem-expand .aex-section-lbl { padding: 8px 12px 4px; }
.litem-expand .aex-empty { padding: 14px 12px 16px; }

.cfg { background: var(--bg2); border-radius: 20px 20px 0 0; border: 0.5px solid var(--border); padding: 24px 20px calc(24px + var(--safe-bottom)); width: 100%; }
.cfg h2 { font-size: 18px; margin-bottom: 8px; }
.cfg p { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
.cfg label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 6px; }
.cfg input { width: 100%; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; padding: 10px 12px; outline: none; font-family: monospace; -webkit-appearance: none; }
.cfg input:focus { border-color: var(--green); }
.btn-g { width: 100%; margin-top: 16px; padding: 14px; border-radius: 12px; border: none; background: var(--green); color: #000; font-size: 16px; font-weight: 600; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; }
.btn-ghost { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: 0.5px solid var(--border); background: transparent; color: var(--text2); font-size: 15px; cursor: pointer; touch-action: manipulation; }

.state { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 15px; }
.state .icon { font-size: 36px; margin-bottom: 12px; display: block; }
.spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: sp 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>My Music <span>by Genre</span></h1>
    <button class="gear-btn" onclick="showConfig()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-input" id="searchInput" type="search" placeholder="Search..." autocomplete="off">
  </div>
  <div class="top-nav">
    <button class="nav-btn active" onclick="switchTab('artists')">Artists</button>
    <button class="nav-btn" onclick="switchTab('albums')">Albums</button>
    <button class="nav-btn" onclick="switchTab('genres')">Genres</button>
    <button class="nav-btn" onclick="switchTab('recent')">Recent</button>
  </div>
</div>

<div class="sub-nav" id="subNav">
  <button class="sub-btn active" onclick="switchSub('added')" id="sub-added">Recently Added</button>
  <button class="sub-btn" onclick="switchSub('played')" id="sub-played">Recently Played</button>
</div>

<div class="sub-nav" id="subNav2">
  <button class="sub-btn active" onclick="switchAddedSub('artists')" id="sub-added-artists">Artists</button>
  <button class="sub-btn" onclick="switchAddedSub('albums')" id="sub-added-albums">Albums</button>
</div>

<div class="sub-nav" id="subNav3">
  <button class="sub-btn active" onclick="switchPlayedSub('albums')" id="sub-played-albums">Albums</button>
  <button class="sub-btn" onclick="switchPlayedSub('artists')" id="sub-played-artists">Artists</button>
</div>

<div class="drill-bar" id="drillBar">
  <div class="drill-top">
    <button class="back-btn" onclick="exitDrill()">‹ Genres</button>
    <div class="drill-title" id="drillTitle"></div>
  </div>
  <div class="drill-tabs">
    <button class="drill-tab active" onclick="switchDrillSub('artists')" id="ds-artists">Artists</button>
    <button class="drill-tab" onclick="switchDrillSub('albums')" id="ds-albums">Albums</button>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <span class="count-lbl" id="countLbl"></span>
  <button class="filter-btn" id="filterBtn" onclick="showGenreModal()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    <span id="filterLbl">All genres</span>
  </button>
  <button class="sort-btn active" id="srtR" onclick="setSort('recent')">Newest</button>
  <button class="sort-btn" id="srtN" onclick="setSort('name')">A–Z</button>
  <button class="sort-btn" id="srtP" onclick="setSort('popular')" style="display:none">Popular</button>
  <div class="view-toggle">
    <button class="view-btn" id="vGrid" onclick="setView('grid')">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
    </button>
    <button class="view-btn active" id="vList" onclick="setView('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>
</div>

<div class="content" id="content"></div>

<div class="modal-ov" id="genreModal" style="display:none" onclick="hideGenreModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="mhead"><h3>Filter by genre</h3><button class="mclose" onclick="hideGenreModal()">×</button></div>
    <div class="msearch"><input id="genreSearch" type="search" placeholder="Search genres..." oninput="filterGenreModal(this.value)"></div>
    <div class="mlist" id="genreList"></div>
  </div>
</div>

<div class="modal-ov" id="configModal" style="display:none" onclick="hideConfig()">
  <div class="cfg" onclick="event.stopPropagation()">
    <h2>Connect your sheet</h2>
    <p>Enter your Google Sheet ID — the string between /d/ and /edit in the sheet URL. Make sure the sheet is shared as "Anyone with the link → Viewer".</p>
    <label>Sheet ID</label>
    <input id="sheetId" type="text" placeholder="your-sheet-id" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn-g" onclick="saveConfig()">Connect</button>
    <button class="btn-ghost" onclick="hideConfig()">Cancel</button>
  </div>
</div>

<script>
const CFG_KEY = 'mmg_cfg_v3';
const DATA_KEY = 'mmg_data_v3';
const TTL = 3600000;

let cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
if (!cfg.sheetId) {
  cfg.sheetId = '1BQVKH85sVqk-jezdbyvz6wkzc87uz6OAdl4N5FiXAxI';
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
}

let artists = [], albums = [], played = [];
let tab = 'artists', sub = 'added', addedSub = 'artists', playedSub = 'albums', sort = 'recent', view = 'list';
let genre = 'All', drill = null, drillSub = 'artists', q = '';
let gIndex = {}, gModalAll = [];

const csv = text => {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const hdr = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const vals=[]; let cur='', inQ=false;
    for (const c of line) {
      if (c==='"'){inQ=!inQ;continue;}
      if (c===','&&!inQ){vals.push(cur);cur='';continue;}
      cur+=c;
    }
    vals.push(cur);
    const o={};
    hdr.forEach((h,i)=>o[h]=(vals[i]||'').trim());
    return o;
  });
};

const fetchSheet = async name => {
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${cfg.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`);
    return csv(await r.text());
  } catch(e) { return []; }
};

const dedup = (rows, keyFn) => {
  const m={};
  rows.forEach(r=>{
    const k=keyFn(r); if(!k) return;
    if(!m[k]) m[k]={...r,_g:new Set()};
    const g=(r.genre||'').trim(); if(g) m[k]._g.add(g);
  });
  return Object.values(m).map(r=>{r.final_genres=Array.from(r._g).join(', ');delete r._g;return r;});
};

async function load(force=false) {
  if (!cfg.sheetId){showConfig();return;}
  const cached = JSON.parse(localStorage.getItem(DATA_KEY)||'null');
  if (!force && cached && Date.now()-cached.ts<TTL) {
    artists=cached.artists; albums=cached.albums; played=cached.played||[];
    buildIdx(); render(); return;
  }
  document.getElementById('content').innerHTML='<div class="state"><div class="spin"></div>Loading your music...</div>';
  const [a,al,p] = await Promise.all([fetchSheet('By_Genre_Artists'),fetchSheet('By_Genre_Albums'),fetchSheet('Recently_Played')]);
  artists = dedup(a, r=>r.artist_url||r.artist_name);
  albums = dedup(al, r=>{
    const url=(r.album_url||'').trim().toLowerCase().replace(/\/$/,'');
    return url || ((r.album_name||'').trim().toLowerCase()+'||'+(r.primary_artist_name||'').trim().toLowerCase());
  });
  played = p;
  buildIdx();
  localStorage.setItem(DATA_KEY, JSON.stringify({ts:Date.now(),artists,albums,played}));
  render();
}

function buildIdx() {
  gIndex={};
  const add=(r,t)=>(r.final_genres||'').split(',').forEach(g=>{g=g.trim();if(!g)return;if(!gIndex[g])gIndex[g]={artists:0,albums:0};gIndex[g][t]++;});
  artists.forEach(r=>add(r,'artists'));
  albums.forEach(r=>add(r,'albums'));
}

function render() {
  // nav
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['artists','albums','genres','recent'][i]===tab));
  document.getElementById('subNav').classList.toggle('visible', tab==='recent');
  document.getElementById('subNav2').classList.toggle('visible', tab==='recent' && sub==='added');
  document.getElementById('subNav3').classList.toggle('visible', tab==='recent' && sub==='played');
  const isDrill = tab==='genres' && drill;
  document.getElementById('drillBar').classList.toggle('visible', isDrill);
  const isGenreList = tab==='genres' && !drill;
  document.getElementById('toolbar').style.display = isGenreList ? 'none' : 'flex';
  const fb = document.getElementById('filterBtn');
  fb.classList.toggle('show', tab==='artists'||tab==='albums'||isDrill);
  fb.classList.toggle('active', genre!=='All'||isDrill);
  document.getElementById('filterLbl').textContent = isDrill ? drill : (genre==='All'?'All genres':genre);

  if (isGenreList) { renderGenreList(); return; }
  if (isDrill) { renderDrill(); return; }
  if (tab==='recent') { renderRecent(); return; }  renderCards(tab==='artists'?artists:albums, tab==='artists'?'artist':'album');
}

const fmtD = s => { try{return s?new Date(s).toLocaleDateString('en-US',{month:'short',year:'numeric'}):''}catch{return '';} };
const fmtDT = s => { try{return s?new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}catch{return '';} };

function filtered(data, typeStr) {
  let rows = data;
  if (genre!=='All') rows=rows.filter(r=>(r.final_genres||'').split(',').map(g=>g.trim().toLowerCase()).includes(genre.toLowerCase()));
  if (q) { const lq=q.toLowerCase(); rows=rows.filter(r=>(r.artist_name||r.album_name||r.track_name||'').toLowerCase().includes(lq)||(r.final_genres||'').toLowerCase().includes(lq)); }
  return [...rows].sort((a,b)=>{
    if (sort==='name') return (a.artist_name||a.album_name||'').localeCompare(b.artist_name||b.album_name||'');
    if (sort==='popular') return (parseInt(b.popularity)||0)-(parseInt(a.popularity)||0);
    return new Date(b.added_date||0)-new Date(a.added_date||0);
  });
}

function buildExpandInner(artist, listMode=false) {
  // For non-followed artists from recently played, check stub map
  if (!artist._notFollowing) {
    const stub = window._playedArtistStubs && window._playedArtistStubs[artist.artist_name];
    if (stub) artist = stub;
  }
  const isNotFollowing = artist._notFollowing === true;
  const artistAlbums = isNotFollowing ? [] : albums
    .filter(a => (a.primary_artist_name||'').toLowerCase() === (artist.artist_name||'').toLowerCase())
    .sort((a,b) => (a.album_name||'').localeCompare(b.album_name||''));
  const url = artist.artist_url || '#';
  const safeName = (artist.artist_name||'').replace(/'/g,"\\'");

  let body;
  if (artistAlbums.length) {
    const lbl = `<div class="aex-section-lbl">${artistAlbums.length} saved album${artistAlbums.length!==1?'s':''}<button class="aex-close" style="margin-left:auto" onclick="closeExpand(event,'${safeName}')">×</button></div>`;
    const rows = artistAlbums.map(a => {
      const albImg = a.album_image_url||'';
      const albUrl = spotifyAppUrl(a.album_url||'#');
      const year = a.release_date ? a.release_date.slice(0,4) : '';
      const thumb2 = albImg
        ? `<img class="aex-album-art" src="${albImg}" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="aex-album-art-ph" style="display:none">💿</div>`
        : `<div class="aex-album-art-ph">💿</div>`;
      return `<a class="aex-album" href="${albUrl}" target="_blank" rel="noopener">
        ${thumb2}
        <div class="aex-album-info">
          <div class="aex-album-name">${a.album_name||''}</div>
          ${year ? `<div class="aex-album-year">${year}</div>` : ''}
        </div>
        <div class="aex-album-arrow">›</div>
      </a>`;
    }).join('');
    body = lbl + rows;
  } else {
    const msg = isNotFollowing
      ? `Not following this artist.`
      : `No saved albums for this artist.`;
    body = `<div class="aex-empty">
      <div class="aex-empty-msg">${msg}</div>
      ${url!=='#' ? `<a class="aex-empty-btn" href="${url}" target="_blank" rel="noopener">${spotifyIcon(12)} Open in Spotify</a>` : ''}
    </div>`;
  }
  return body;
}

      <button onclick="document.getElementById('unfollowedPanel').remove()" style="background:var(--bg2);border:0.5px solid var(--border);color:var(--text2);width:28px;height:28px;border-radius:14px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">×</button>`;

// Convert Spotify web URL to native app URI so albums open in the Spotify app
function spotifyAppUrl(webUrl) {
  if (!webUrl || webUrl === '#') return webUrl;
  const m = webUrl.match(/open\.spotify\.com\/(album|track|artist|playlist)\/([a-zA-Z0-9]+)/);
  if (m) return `spotify:${m[1]}:${m[2]}`;
  return webUrl;
}

function cardH(r, type) {
  const isA = type==='artist';
  const name = isA?(r.artist_name||''):(r.album_name||r.track_name||'');
  const sub2 = isA?'':(r.primary_artist_name||'');
  const img = isA?r.artist_image_url:(r.album_image_url||r.image_url);
  const rawUrl = isA?r.artist_url:(r.album_url||r.track_url||'#');
  const url = isA?rawUrl:spotifyAppUrl(rawUrl);
  const tags = (r.final_genres||'').split(',').map(g=>g.trim()).filter(Boolean).slice(0,2).map(g=>`<span class="gtag">${g}</span>`).join('');
  const date = type==='played'?fmtDT(r.played_at):fmtD(r.added_date);
  const em = isA?'🎤':'💿';
  const imgEl = img?`<img class="card-img" src="${img}" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="card-ph" style="display:none">${em}</div>`:`<div class="card-ph">${em}</div>`;

  if (isA) {
    const safeName = (r.artist_name||'').replace(/'/g,"\\'");
    const isOpen = expandedArtist === r.artist_name;
    const borderStyle = isOpen ? 'border-color:var(--green)' : '';
    const tappableTags = (r.final_genres||'').split(',').map(g=>g.trim()).filter(Boolean).slice(0,2)
      .map(g=>`<span class="gtag" onclick="event.stopPropagation();goToGenre('${g.replace(/'/g,"\\'")}');" style="cursor:pointer">${g}</span>`).join('');
    return `<div class="card" onclick="toggleArtistExpand('${safeName}')" style="cursor:pointer;${borderStyle}">${imgEl}<div class="card-body"><div class="card-name">${name}</div><div class="card-genres">${tappableTags}</div>${date?`<div class="card-date">${date}</div>`:''}</div></div>`;
  }
  return `<a class="card" href="${url||'#'}">${imgEl}<div class="card-body"><div class="card-name">${name}</div>${sub2?`<div class="card-sub" onclick="event.preventDefault();event.stopPropagation();toggleArtistExpand('${sub2.replace(/'/g,"\\'")}','${(r.artist_url||'').replace(/'/g,"\\'")}');" style="cursor:pointer;color:var(--green)">${sub2}</div>`:''}<div class="card-genres">${tags}</div>${date?`<div class="card-date">${date}</div>`:''}</div></a>`;
}

function listH(r, type, idx) {
  const isA = type==='artist';
  const name = isA?(r.artist_name||''):(r.album_name||r.track_name||'');
  const sub2 = isA?(r.final_genres||'').split(',')[0]?.trim()||'':(r.primary_artist_name||'');
  const img = isA?r.artist_image_url:(r.album_image_url||r.image_url);
  const rawUrl = isA?r.artist_url:(r.album_url||r.track_url||'#');
  const url = isA?rawUrl:spotifyAppUrl(rawUrl);
  const date = type==='played'?fmtDT(r.played_at):fmtD(r.added_date);
  const em = isA?'🎤':'💿';
  const th = img?`<div class="lthumb"><img src="${img}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='${em}'"></div>`:`<div class="lthumb">${em}</div>`;
  const num = idx!=null?`<div class="lnum">${idx+1}</div>`:'';

  if (isA) {
    const safeName = (r.artist_name||'').replace(/'/g,"\\'");
    const safeGenre = (sub2||'').replace(/'/g,"\\'");
    const isOpen = expandedArtist === r.artist_name;
    const expandHTML = isOpen
      ? `<div class="litem-expand">${buildExpandInner(r, true)}</div>`
      : '';
    const genreLbl = sub2 ? `<div class="lsub" onclick="event.stopPropagation();goToGenre('${safeGenre}');" style="cursor:pointer;color:var(--green)">${sub2}</div>` : '';
    return `<div>
      <div class="litem litem-artist" onclick="toggleArtistExpand('${safeName}')">${num}${th}<div class="linfo"><div class="lname">${name}</div>${genreLbl}</div>${date?`<div class="ldate">${date}</div>`:''}</div>
      ${expandHTML}
    </div>`;
  }
  return `<a class="litem" href="${url||'#'}">${num}${th}<div class="linfo"><div class="lname">${name}</div>${sub2?`<div class="lsub" onclick="event.preventDefault();event.stopPropagation();toggleArtistExpand('${sub2.replace(/'/g,"\\'")}','${(r.artist_url||'').replace(/'/g,"\\'")}');" style="cursor:pointer;color:var(--green)">${sub2}</div>`:''}</div>${date?`<div class="ldate">${date}</div>`:''}</a>`;
}

function renderCards(data, type) {
  const rows = filtered(data, type);
  document.getElementById('countLbl').textContent = `${rows.length} ${type}s`;
  const c = document.getElementById('content');
  if (!rows.length){c.innerHTML='<div class="state"><span class="icon">🔍</span>No results</div>';return;}



  if (view==='list') {
    c.innerHTML = `<div class="list">${rows.map((r,i)=>listH(r,type,i)).join('')}</div>`;
    return;
  }

  // Grid view — for artists, inject expand panel after the card in the correct row
  if (type==='artist') {
    let html = '<div class="grid">';
    rows.forEach((r, i) => {
      html += cardH(r, type);
      // After every 2nd card (i=1,3,5…) OR after the last card if odd count,
      // check if the expanded artist is in this pair
      const isEvenIndex = (i % 2 === 1);
      const isLast = (i === rows.length - 1);
      if (isEvenIndex || isLast) {
        // Pair is rows[i-1] (or rows[i] if last+odd) and rows[i]
        const pairStart = isLast && rows.length % 2 === 1 ? i : i - 1;
        const pairNames = [rows[pairStart].artist_name];
        if (!isLast || rows.length % 2 === 0) pairNames.push(rows[i].artist_name);
        if (expandedArtist && pairNames.includes(expandedArtist)) {
          const artist = artists.find(a => a.artist_name === expandedArtist);
          if (artist) {
            html += `<div class="artist-expand">${buildExpandInner(artist, false)}</div>`;
          }
        }
      }
    });
    html += '</div>';
    c.innerHTML = html;
    return;
  }

  c.innerHTML = `<div class="grid">${rows.map(r=>cardH(r,type)).join('')}</div>`;
}

function renderGenreList() {

  document.getElementById('countLbl').textContent='';
  const c = document.getElementById('content');
  if (!genres.length){c.innerHTML='<div class="state"><span class="icon">🎵</span>No genres yet — run the sync script</div>';return;}
  c.innerHTML=`<div class="genre-list">${genres.map(([g,ct])=>`<div class="grow" onclick="enterDrill('${g.replace(/'/g,"\\'")}')"><div class="gname">${g}</div><div class="gcounts">${ct.artists?ct.artists+' artists':''}${ct.artists&&ct.albums?' · ':''}${ct.albums?ct.albums+' albums':''}</div><div class="garrow">›</div></div>`).join('')}</div>`;
}

function renderDrill(){

  rows=[...rows].sort((a,b)=>sort==='name'?(a.artist_name||a.album_name||'').localeCompare(b.artist_name||b.album_name||''):new Date(b.added_date||0)-new Date(a.added_date||0));

      c.innerHTML=`<div class="list">${rows.map((r,i)=>listH(r,type,i)).join('')}</div>`;
    } else {
      let html='<div class="grid">';
      rows.forEach((r,i)=>{
        html+=cardH(r,type);
        const isEvenIndex=(i%2===1), isLast=(i===rows.length-1);
        if(isEvenIndex||isLast){
          const pairStart=isLast&&rows.length%2===1?i:i-1;
          const pairNames=[rows[pairStart].artist_name];
          if(!isLast||rows.length%2===0)pairNames.push(rows[i].artist_name);
          if(expandedArtist&&pairNames.includes(expandedArtist)){

      c.innerHTML=html;

    return;

  c.innerHTML=view==='grid'?`<div class="grid">${rows.map(r=>cardH(r,type)).join('')}</div>`:`<div class="list">${rows.map((r,i)=>listH(r,type,i)).join('')}</div>`;

          :`<div class="lthumb">🎤</div>`;

        const isOpen=expandedArtist===a.artist_name;
        if(!fullArtist){
          window._playedArtistStubs[a.artist_name]={artist_name:a.artist_name,artist_url:a.artist_url||'',artist_image_url:'',final_genres:'',_notFollowing:true};
        }
        const expandArtist=fullArtist||window._playedArtistStubs[a.artist_name];

        return `<div>
          <div class="litem litem-artist" onclick="toggleArtistExpand('${safeName}')">
            <div class="lnum">${i+1}</div>
            ${th}
            <div class="linfo">
              <div class="lname">${a.artist_name}${followLbl}</div>
              <div class="lsub">${a.track_count} track${a.track_count!==1?'s':''} played</div>
            </div>
            ${date?`<div class="ldate">${date}</div>`:''}
          </div>
          ${expandHTML}
        </div>`;
      }).join('');
      c.innerHTML=`<div class="list">${html}</div>`;
      return;
    }

    // Albums view (default)
    const albumMap={};
    const albumOrder=[];
    played.forEach(r=>{
      const key=(r.album_url||r.track_url||'')+(r.primary_artist_name||'');
      if(!key) return;
      if(!albumMap[key]){
        albumMap[key]={
          album_name: r.album_name||'',
          primary_artist_name: r.primary_artist_name||'',
          album_url: r.album_url||r.track_url||'#',
          image_url: r.image_url||'',
          artist_url: r.artist_url||'',
          played_at: r.played_at||'',
          track_count: 0,
        };
        albumOrder.push(key);
      }
      albumMap[key].track_count++;
      if((r.played_at||'')>albumMap[key].played_at) albumMap[key].played_at=r.played_at;
    });

    const albumRows=albumOrder.map(k=>albumMap[k]);
    document.getElementById('countLbl').textContent=`${albumRows.length} album${albumRows.length!==1?'s':''}`;

    const html=albumRows.map((a,i)=>{
      const img=a.image_url;
      const th=img
        ?`<div class="lthumb"><img src="${img}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='💿'"></div>`
        :`<div class="lthumb">💿</div>`;
      const date=fmtDT(a.played_at);
      const trackLbl=`${a.track_count} track${a.track_count!==1?'s':''}`;
      const safeArtist=(a.primary_artist_name||'').replace(/'/g,"\\'");
      const safeArtistUrl=(a.artist_url||'').replace(/'/g,"\\'");
      return `<a class="litem" href="${spotifyAppUrl(a.album_url)}" target="_blank" rel="noopener">
        <div class="lnum">${i+1}</div>
        ${th}
        <div class="linfo">
          <div class="lname">${a.album_name}</div>
          <div class="lsub">${a.primary_artist_name?`<span onclick="event.preventDefault();event.stopPropagation();toggleArtistExpand('${safeArtist}','${safeArtistUrl}');" style="cursor:pointer;color:var(--green)">${a.primary_artist_name}</span> · `:''}${trackLbl}</div>
        </div>
        ${date?`<div class="ldate">${date}</div>`:''}
      </a>`;
    }).join('');
    c.innerHTML=`<div class="list">${html}</div>`;
    return;
  }
  let rows;
  if (addedSub==='artists') {
    rows = [...artists.map(r=>({...r,_t:'artist'}))];
    if(q){const lq=q.toLowerCase();rows=rows.filter(r=>(r.artist_name||'').toLowerCase().includes(lq));}
    rows.sort((a,b)=>sort==='name'?(a.artist_name||'').localeCompare(b.artist_name||''):sort==='popular'?(parseInt(b.popularity)||0)-(parseInt(a.popularity)||0):new Date(b.added_date||0)-new Date(a.added_date||0));
    document.getElementById('countLbl').textContent=`${rows.length} artists`;
  } else {
    rows = [...albums.map(r=>({...r,_t:'album'}))];
    if(q){const lq=q.toLowerCase();rows=rows.filter(r=>(r.album_name||'').toLowerCase().includes(lq)||(r.primary_artist_name||'').toLowerCase().includes(lq));}
    rows.sort((a,b)=>sort==='name'?(a.album_name||'').localeCompare(b.album_name||''):new Date(b.added_date||0)-new Date(a.added_date||0));
    document.getElementById('countLbl').textContent=`${rows.length} albums`;
  }
  const c=document.getElementById('content');
  if(!rows.length){c.innerHTML='<div class="state"><span class="icon">🔍</span>No results</div>';return;}
  c.innerHTML=view==='grid'?`<div class="grid">${rows.map(r=>cardH(r,r._t)).join('')}</div>`:`<div class="list">${rows.map((r,i)=>listH(r,r._t,i)).join('')}</div>`;
}

function switchTab(t){
  tab=t;drill=null;genre='All';q='';expandedArtist=null;addedSub='artists';playedSub='albums';
  document.getElementById('searchInput').value='';
  const showPop = t==='artists' || (t==='recent' && sub==='added' && addedSub==='artists');
  document.getElementById('srtP').style.display = showPop ? 'inline-block' : 'none';
  if (sort==='popular' && !showPop) { sort='recent'; document.getElementById('srtR').classList.add('active'); document.getElementById('srtP').classList.remove('active'); }
  render();
}
function switchSub(s){
  sub=s;
  document.getElementById('sub-added').classList.toggle('active',s==='added');
  document.getElementById('sub-played').classList.toggle('active',s==='played');
  document.getElementById('subNav2').classList.toggle('visible', s==='added');
  document.getElementById('subNav3').classList.toggle('visible', s==='played');
  renderRecent();
}
function switchAddedSub(s){
  addedSub=s;
  document.getElementById('sub-added-artists').classList.toggle('active',s==='artists');
  document.getElementById('sub-added-albums').classList.toggle('active',s==='albums');
  renderRecent();
}
function switchPlayedSub(s){
  playedSub=s;
  document.getElementById('sub-played-albums').classList.toggle('active',s==='albums');
  document.getElementById('sub-played-artists').classList.toggle('active',s==='artists');
  renderRecent();
}
function setSort(s){
  sort=s;
  document.getElementById('srtR').classList.toggle('active',s==='recent');
  document.getElementById('srtN').classList.toggle('active',s==='name');
  document.getElementById('srtP').classList.toggle('active',s==='popular');
  render();
}
function setView(v){view=v;document.getElementById('vGrid').classList.toggle('active',v==='grid');document.getElementById('vList').classList.toggle('active',v==='list');render();}
document.getElementById('searchInput').addEventListener('input',e=>{q=e.target.value;render();});

function showGenreModal(){
  const MIN=5;
  gModalAll=[{name:'All',count:artists.length+albums.length},...Object.entries(gIndex).filter(([,c])=>(c.artists+c.albums)>=MIN).sort((a,b)=>(b[1].artists+b[1].albums)-(a[1].artists+a[1].albums)).map(([g,c])=>({name:g,count:c.artists+c.albums}))];
  document.getElementById('genreSearch').value='';
  renderGenreModal(gModalAll);
  document.getElementById('genreModal').style.display='flex';
}
function renderGenreModal(items){
  const cur=drill||genre;
  document.getElementById('genreList').innerHTML=items.map(i=>`<div class="mgenre${i.name===cur?' sel':''}" onclick="pickGenre('${i.name.replace(/'/g,"\\'")}')"><span class="mgname">${i.name}</span><span class="mgcount">${i.count}</span></div>`).join('');
}
function filterGenreModal(s){renderGenreModal(s?gModalAll.filter(i=>i.name.toLowerCase().includes(s.toLowerCase())):gModalAll);}
function pickGenre(g){
  hideGenreModal();
  if(tab==='genres'){g==='All'?exitDrill():enterDrill(g);}
  else{genre=g;render();}
}
function hideGenreModal(){document.getElementById('genreModal').style.display='none';}

function showConfig(){document.getElementById('sheetId').value=cfg.sheetId||'';document.getElementById('configModal').style.display='flex';}
function hideConfig(){document.getElementById('configModal').style.display='none';}
function saveConfig(){
  const id=document.getElementById('sheetId').value.trim();
  if(!id)return;
  cfg.sheetId=id;
  localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
  localStorage.removeItem(DATA_KEY);
  hideConfig();
  load(true);
}

hideConfig();
load();
</script>
