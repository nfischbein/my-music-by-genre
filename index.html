<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Music">
<title>My Music by Genre</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0a;
    --bg2: #141414;
    --bg3: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --text2: #999;
    --text3: #666;
    --green: #1db954;
    --green2: #1aa34a;
    --radius: 12px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 16px 12px;
    border-bottom: 0.5px solid var(--border);
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 12px;
  }

  .header h1 span { color: var(--green); }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--text3);
  }
  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 9px 12px 9px 36px;
    outline: none;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--green); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 2px;
  }
  .tab {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    font-weight: 600;
  }

  /* Genre filter */
  .genre-wrap {
    padding: 10px 16px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    display: flex;
    gap: 8px;
    white-space: nowrap;
  }
  .genre-wrap::-webkit-scrollbar { display: none; }

  .genre-pill {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .genre-pill.active {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    font-weight: 600;
  }

  /* Sort bar */
  .sort-bar {
    padding: 10px 16px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sort-bar span {
    font-size: 12px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sort-btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
  }
  .sort-btn.active {
    border-color: var(--green);
    color: var(--green);
  }

  /* Count */
  .count-bar {
    padding: 8px 16px 0;
    font-size: 12px;
    color: var(--text3);
  }

  /* Grid */
  .grid {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-bottom: calc(80px + var(--safe-bottom));
  }

  /* Card */
  .card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    text-decoration: none;
    display: block;
  }
  .card:active { transform: scale(0.97); border-color: var(--green); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--bg3);
    display: block;
  }

  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .card-body {
    padding: 10px;
  }

  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 11px;
    color: var(--text2);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .card-genres {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .genre-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(29,185,84,0.12);
    color: var(--green);
    font-weight: 500;
  }

  .card-date {
    font-size: 10px;
    color: var(--text3);
    margin-top: 5px;
  }

  /* Loading / empty */
  .state-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
    font-size: 15px;
    grid-column: 1 / -1;
  }
  .state-msg .icon { font-size: 40px; margin-bottom: 12px; display: block; }
  .state-msg a { color: var(--green); text-decoration: none; }

  /* Config modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    padding-bottom: var(--safe-bottom);
  }
  .modal {
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    border: 0.5px solid var(--border);
    padding: 24px 20px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
  .modal label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 6px; margin-top: 16px; }
  .modal input {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    font-family: monospace;
  }
  .modal input:focus { border-color: var(--green); }
  .modal-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--green);
    color: #000;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-cancel {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 15px;
    cursor: pointer;
  }

  /* Settings btn */
  .settings-btn {
    position: fixed;
    bottom: calc(16px + var(--safe-bottom));
    right: 16px;
    width: 44px; height: 44px;
    border-radius: 22px;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 50;
    color: var(--text2);
  }

  /* Spinner */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>My Music <span>by Genre</span></h1>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" id="searchInput" type="search" placeholder="Search artists or albums..." autocomplete="off">
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('artists')">Artists</button>
    <button class="tab" onclick="switchTab('albums')">Albums</button>
    <button class="tab" onclick="switchTab('recent')">Recent</button>
  </div>
  <div class="tabs" id="recentSubTabs" style="display:none; margin-top:6px;">
    <button class="tab active" onclick="switchRecentSub('all')" id="rsub-all">All</button>
    <button class="tab" onclick="switchRecentSub('artists')" id="rsub-artists">Artists</button>
    <button class="tab" onclick="switchRecentSub('albums')" id="rsub-albums">Albums</button>
  </div></div>

<div class="genre-wrap" id="genreBar"></div>

<div class="sort-bar">
  <span>Sort</span>
  <button class="sort-btn active" onclick="setSort('recent')" id="sort-recent">Newest first</button>
  <button class="sort-btn" onclick="setSort('name')" id="sort-name">A–Z</button>
</div>

<div class="count-bar" id="countBar"></div>

<div class="grid" id="grid"></div>

<button class="settings-btn" onclick="showConfig()" title="Settings">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<div class="modal-overlay" id="configModal" style="display:none">
  <div class="modal">
    <h2>Connect your sheet</h2>
    <p>Enter the ID of your Google Sheet. This is the long string in the URL between /d/ and /edit.<br><br>
    Your sheet must be shared publicly (View access) so this app can read it.<br><br>
    In Google Sheets: Share → Anyone with the link → Viewer.</p>
    <label>Google Sheet ID</label>
    <input id="sheetIdInput" type="text" placeholder="1BQVKH85sVqk-jezdbyvz6wkzc87uz6OAdl4N5FiXAxI" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="modal-btn" onclick="saveConfig()">Connect sheet</button>
    <button class="modal-cancel" onclick="hideConfig()">Cancel</button>
  </div>
</div>

<script>
const CACHE_KEY = 'mmbg_config';
const DATA_CACHE_KEY = 'mmbg_data';
const DATA_CACHE_TTL = 3600000; // 1 hour

let config = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
let allArtists = [], allAlbums = [];
let currentTab = 'artists';
let currentGenre = 'All';
let currentSort = 'recent';
let searchQuery = '';
let recentSub = 'all';

function getSheetCSVUrl(tabName) {
  const id = config.sheetId;
  if (!id) return null;
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { vals.push(cur); cur = ''; continue; }
      cur += c;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  });
}

async function fetchTab(tabName) {
  const url = getSheetCSVUrl(tabName);
  if (!url) return [];
  try {
    const r = await fetch(url);
    const text = await r.text();
    return parseCSV(text);
  } catch(e) {
    console.error('Fetch error', tabName, e);
    return [];
  }
}

async function loadData(force = false) {
  if (!config.sheetId) { showConfig(); return; }

  const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || 'null');
  if (!force && cached && (Date.now() - cached.ts < DATA_CACHE_TTL)) {
    allArtists = cached.artists;
    allAlbums = cached.albums;
    render();
    return;
  }

  showLoading();
  const [artists, albums] = await Promise.all([
    fetchTab('By_Genre_Artists'),
    fetchTab('By_Genre_Albums')
  ]);
  allArtists = artists;
  allAlbums = albums;
  localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ ts: Date.now(), artists, albums }));
  render();
}

function showLoading() {
  document.getElementById('grid').innerHTML = `<div class="state-msg"><div class="spinner"></div>Loading your music...</div>`;
  document.getElementById('genreBar').innerHTML = '';
  document.getElementById('countBar').textContent = '';
}

function getActiveData() {
  if (currentTab === 'artists') return allArtists;
  if (currentTab === 'albums') return allAlbums;
  // recent tab
  if (recentSub === 'artists') return allArtists.map(a => ({...a, _type:'artist'}));
  if (recentSub === 'albums') return allAlbums.map(a => ({...a, _type:'album'}));
  return [...allArtists.map(a => ({...a, _type:'artist'})), ...allAlbums.map(a => ({...a, _type:'album'}))];
}

function getAllGenres() {
  const data = currentTab === 'recent'
    ? [...allArtists, ...allAlbums]
    : getActiveData();
  const genres = new Set();
  data.forEach(row => {
    (row.genre || row.final_genres || '').split(',').forEach(g => {
      const t = g.trim();
      if (t) genres.add(t);
    });
  });
  return ['All', ...Array.from(genres).sort()];
}

function filterAndSort(data) {
  let rows = data;

  if (currentGenre !== 'All') {
    rows = rows.filter(r => {
      const g = (r.genre || r.final_genres || '').toLowerCase();
      return g.split(',').map(x => x.trim()).includes(currentGenre.toLowerCase());
    });
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    rows = rows.filter(r => {
      const name = (r.artist_name || r.album_name || r.primary_artist_name || '').toLowerCase();
      const genre = (r.genre || r.final_genres || '').toLowerCase();
      return name.includes(q) || genre.includes(q);
    });
  }

  rows = [...rows].sort((a, b) => {
    if (currentSort === 'recent') {
      const da = new Date(a.added_date || 0);
      const db = new Date(b.added_date || 0);
      return db - da;
    }
    const na = (a.artist_name || a.album_name || '').toLowerCase();
    const nb = (b.artist_name || b.album_name || '').toLowerCase();
    return na.localeCompare(nb);
  });

  return rows;
}

function formatDate(str) {
  if (!str) return '';
  try {
    return new Date(str).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  } catch { return ''; }
}

function cardHTML(row, type) {
  const isArtist = type === 'artist' || !!row.artist_name && !row.album_name;
  const name = isArtist ? (row.artist_name || '') : (row.album_name || '');
  const sub = isArtist ? '' : (row.primary_artist_name || '');
  const img = isArtist ? row.artist_image_url : row.album_image_url;
  const url = isArtist ? row.artist_url : row.album_url;
  const genres = (row.genre || row.final_genres || '').split(',').map(g => g.trim()).filter(Boolean).slice(0, 2);
  const date = formatDate(row.added_date);

  const imgEl = img
    ? `<img class="card-img" src="${img}" alt="${name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    + `<div class="card-img-placeholder" style="display:none">${isArtist ? '🎤' : '💿'}</div>`
    : `<div class="card-img-placeholder">${isArtist ? '🎤' : '💿'}</div>`;

  const genreTags = genres.map(g => `<span class="genre-tag">${g}</span>`).join('');
  const subEl = sub ? `<div class="card-sub">${sub}</div>` : '';
  const dateEl = date ? `<div class="card-date">Added ${date}</div>` : '';

  return `<a class="card" href="${url || '#'}" target="_blank" rel="noopener">
    ${imgEl}
    <div class="card-body">
      <div class="card-name">${name}</div>
      ${subEl}
      <div class="card-genres">${genreTags}</div>
      ${dateEl}
    </div>
  </a>`;
}

function render() {
  renderGenreBar();
  renderGrid();
}

function renderGenreBar() {
  const genres = getAllGenres();
  const bar = document.getElementById('genreBar');
  bar.innerHTML = genres.map(g =>
    `<button class="genre-pill${g === currentGenre ? ' active' : ''}" onclick="selectGenre('${g.replace(/'/g, "\\'")}')">${g}</button>`
  ).join('');
}

function renderGrid() {
  const data = getActiveData();
  const filtered = filterAndSort(data);
  const grid = document.getElementById('grid');
  const count = document.getElementById('countBar');

  const label = currentTab === 'artists' ? 'artists'
    : currentTab === 'albums' ? 'albums'
    : recentSub === 'artists' ? 'artists'
    : recentSub === 'albums' ? 'albums'
    : 'items';
  count.textContent = `${filtered.length} ${label}${currentGenre !== 'All' ? ` in "${currentGenre}"` : ''}`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="state-msg"><span class="icon">🔍</span>No results found</div>`;
    return;
  }

  const isRecent = currentTab === 'recent';
  grid.innerHTML = filtered.map(row => {
    const type = isRecent ? (row._type || (row.artist_name && !row.album_name ? 'artist' : 'album')) : currentTab.slice(0, -1);
    return cardHTML(row, type);
  }).join('');
}

function switchTab(tab) {
  currentTab = tab;
  currentGenre = 'All';
  recentSub = 'all';
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', ['artists','albums','recent'][i] === tab);
  });
  const subTabs = document.getElementById('recentSubTabs');
  subTabs.style.display = tab === 'recent' ? 'flex' : 'none';
  ['all','artists','albums'].forEach(s => {
    document.getElementById('rsub-' + s).classList.toggle('active', s === 'all');
  });
  render();
}

function switchRecentSub(sub) {
  recentSub = sub;
  currentGenre = 'All';
  ['all','artists','albums'].forEach(s => {
    document.getElementById('rsub-' + s).classList.toggle('active', s === sub);
  });
  render();
}

function selectGenre(g) {
  currentGenre = g;
  renderGenreBar();
  renderGrid();
}

function setSort(s) {
  currentSort = s;
  document.getElementById('sort-recent').classList.toggle('active', s === 'recent');
  document.getElementById('sort-name').classList.toggle('active', s === 'name');
  renderGrid();
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderGrid();
});

function showConfig() {
  document.getElementById('sheetIdInput').value = config.sheetId || '';
  document.getElementById('configModal').style.display = 'flex';
}

function hideConfig() {
  document.getElementById('configModal').style.display = 'none';
}

function saveConfig() {
  const id = document.getElementById('sheetIdInput').value.trim();
  if (!id) return;
  config.sheetId = id;
  localStorage.setItem(CACHE_KEY, JSON.stringify(config));
  localStorage.removeItem(DATA_CACHE_KEY);
  hideConfig();
  loadData(true);
}

if (!config.sheetId) {
  showConfig();
} else {
  loadData();
}
</script>
</body>
</html>
